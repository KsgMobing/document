<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex — 预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #f5f5f5; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #f5f5f5; z-index: 999;
      transition: opacity 0.5s;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e0e0e0;
      border-top-color: #3A4A56;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { margin-top: 16px; color: #3A4A56; font-size: 14px; }
    #loading .error { color: #e74c3c; margin-top: 12px; display: none; max-width: 500px; text-align: center; line-height: 1.6; }
    iframe {
      width: 100%; height: 100%; border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>正在加载 Apex 编辑器...</p>
    <div class="error" id="error"></div>
  </div>
  <iframe id="apex" src="https://ksgmobing.github.io/document/?embed"></iframe>

  <script>
    const params = new URLSearchParams(location.search);
    const fileUrl = params.get('file');
    const fileName = params.get('name');
    const loading = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const iframe = document.getElementById('apex');

    if (!fileUrl) {
      loading.classList.add('hidden');
      // No file param - show the normal Apex UI
    } else {
      // Wait for Apex iframe to be ready, then send the file
      let ready = false;
      let opened = false;

      window.addEventListener('message', (event) => {
        // Accept messages from Apex
        if (event.source !== iframe.contentWindow) return;

        if (event.data?.type === 'document:ready') {
          ready = true;
          openFile();
        }
      });

      function openFile() {
        if (opened || !ready) return;
        opened = true;

        iframe.contentWindow.postMessage({
          type: 'document:open-url',
          payload: {
            url: fileUrl,
            fileName: fileName || fileUrl.split('/').pop() || 'document',
          }
        }, '*');

        // Listen for opened confirmation
        const onOpened = (event) => {
          if (event.source !== iframe.contentWindow) return;
          if (event.data?.type === 'document:opened') {
            loading.classList.add('hidden');
          }
          if (event.data?.type === 'document:error') {
            errorEl.textContent = '打开文件失败: ' + (event.data?.payload?.message || '未知错误');
            errorEl.style.display = 'block';
            loading.querySelector('p').textContent = '加载失败';
          }
        };
        window.addEventListener('message', onOpened);

        // Fallback: hide loading after 8s regardless
        setTimeout(() => loading.classList.add('hidden'), 8000);
      }

      // If iframe loads before we get the ready signal
      iframe.onload = () => {
        // The embed mode sends 'document:ready' on window load
        // If it doesn't come within 3s, try anyway
        setTimeout(() => {
          if (!ready) {
            ready = true;
            openFile();
          }
        }, 3000);
      };
    }
  </script>
</body>
</html>
